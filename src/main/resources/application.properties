spring.application.name=Logistics
# spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# Datasource — env vars resolve on Render, fallback to local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false

app.jwt.secret=${APP_JWT_SECRET:LogisticsJwtSecretKeyForSpringBoot3Example_1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# File storage
app.storage.pod-directory=${APP_STORAGE_POD_DIR:./pod-uploads}
